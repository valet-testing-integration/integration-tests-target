name: integration-tests/designer/freestyle-elephant
on:
  workflow_run:
    workflows:
    - "/test"
    - ''
    types:
    - completed
jobs:
  build:
    runs-on:
      - ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Set up JDK 1.11
      uses: actions/setup-java@v4.0.0
      with:
        distribution: zulu
        java-version: '1.11'
        settings-path: "${{ github.workspace }}"
    - name: Run ant
      run: ant -noinput -buildfile build.xml
